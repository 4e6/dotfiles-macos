# aria2 configuration
# Read automatically from ~/.aria2/aria2.conf (no --conf-path needed).

# --- Seeding ---------------------------------------------------------------
# Seed regardless of share ratio. 0.0 disables the ratio-based stop entirely,
# so completed torrents keep seeding until you stop aria2 (or hit seed-time).
seed-ratio=0.0

# No seed-time is set, so seeding continues indefinitely.
# To cap it later, uncomment and set minutes (e.g. seed for 24h then stop):
#seed-time=1440

# --- Resume ----------------------------------------------------------------
# Resume partially downloaded files / torrents instead of restarting.
continue=true

# --- Disk allocation -------------------------------------------------------
# Default is 'prealloc', which writes zeros over the whole file before the
# download starts — slow for large files. 'falloc' reserves the space via the
# filesystem instead: instant on APFS, and still fails fast if the disk is
# too small. Use 'none' if you'd rather skip reservation entirely.
file-allocation=falloc
